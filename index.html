/* ---------------------------- utils ---------------------------- */

/* Deterministic RNG: the daily challenge seeds this so everyone gets the
   same modifiers and card offers for a given date. Defaults to Math.random. */
let RNG = Math.random;

function seedRng(seed) {
  let a = (seed >>> 0) || 1;
  RNG = function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function unseedRng() { RNG = Math.random; }

function dailySeed() {
  const d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}

function dailyKey() { return 'prismbreak.daily.' + dailySeed(); }

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + RNG() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[(RNG() * arr.length) | 0];
const TAU = Math.PI * 2;

function roundedRect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

/* ---------------------------- audio ---------------------------- */

const Sound = {
  ctx: null,
  on: true,
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { this.on = false; return; }
    try { this.ctx = new AC(); } catch (e) { this.on = false; }
  },
  resume() {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  toggle() {
    this.on = !this.on;
    if (this.on) { Music.start(); Sound.card(); } else { Music.stop(); }
  },
  tone(freq, dur, type, gain, slideTo) {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain || 0.05, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g);
    g.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  },
  brick(hp) { this.tone(420 + hp * 90, 0.07, 'square', 0.045, 620 + hp * 90); },
  break_() { this.tone(180, 0.16, 'sawtooth', 0.05, 60); },
  paddle() { this.tone(320, 0.08, 'triangle', 0.07, 460); },
  wall() { this.tone(240, 0.04, 'sine', 0.03); },
  launch() { this.tone(520, 0.1, 'triangle', 0.06, 880); },
  lose() { this.tone(220, 0.5, 'sawtooth', 0.07, 70); },
  card() { this.tone(700, 0.12, 'triangle', 0.06, 1200); },
  level() { this.tone(660, 0.1, 'triangle', 0.06, 990); },
  laser() { this.tone(1200, 0.05, 'square', 0.02, 700); },
  resonance() { this.tone(880, 0.09, 'triangle', 0.05, 1760); },
  shift() { this.tone(560, 0.05, 'sine', 0.03, 760); },
  overdrive() { this.tone(120, 0.45, 'sawtooth', 0.08, 1600); },
};

/* ---------------------------- music ---------------------------- */

/* A slow pentatonic pulse synth — no files, all oscillators. */
const Music = {
  timer: null,
  step: 0,
  base: [110.00, 130.81, 146.83, 164.81, 196.00, 220.00],
  pattern: [0, 2, 4, 5, 3, 2, 1, 3],
  start() {
    if (!Sound.ctx || this.timer) return;
    this.timer = setInterval(() => this.tick(), 300);
  },
  stop() {
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
  },
  tick() {
    if (!Sound.on || !Sound.ctx) return;
    const t = Sound.ctx.currentTime;
    const idx = this.pattern[this.step % this.pattern.length];
    const freq = this.base[idx] * (1 + Math.min(G.level, 20) * 0.012);
    const osc = Sound.ctx.createOscillator();
    const g = Sound.ctx.createGain();
    const filt = Sound.ctx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.setValueAtTime(900, t);
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.014, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
    osc.connect(filt);
    filt.connect(g);
    g.connect(Sound.ctx.destination);
    osc.start(t);
    osc.stop(t + 0.6);

    // a soft shimmer an octave up every other bar
    if (this.step % 8 === 0) {
      const o2 = Sound.ctx.createOscillator();
      const g2 = Sound.ctx.createGain();
      o2.type = 'sine';
      o2.frequency.setValueAtTime(freq * 4, t);
      g2.gain.setValueAtTime(0.0001, t);
      g2.gain.exponentialRampToValueAtTime(0.007, t + 0.05);
      g2.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
      o2.connect(g2);
      g2.connect(Sound.ctx.destination);
      o2.start(t);
      o2.stop(t + 1.2);
    }
    this.step += 1;
  },
};

function runReport() {
  const taken = G.upg ? CARDS.filter((c) => (G.upg.counts[c.id] || 0) > 0) : [];
  const names = taken.map((c) => (LANG === 'zh' && c.zh ? c.zh : c.name)).join('/');
  if (LANG === 'zh') {
    return '棱镜爆破' + (G.daily ? '·每日挑战' : '') + ' 第 ' + G.level + ' 层 ' + G.score + ' 分'
      + (G.runReso ? ' 共鸣' + G.runReso + '次' : '')
      + (G.runOdKills ? ' 超载破' + G.runOdKills + '块' : '')
      + (names ? ' 卡组:' + names : '')
      + ' — prism.haohaop.com';
  }
  return 'PRISM BREAK' + (G.daily ? ' daily' : '') + ' — floor ' + G.level + ', ' + G.score + ' pts'
    + (G.runReso ? ', ' + G.runReso + ' resonances' : '')
    + (G.runOdKills ? ', ' + G.runOdKills + ' overdrive kills' : '')
    + (names ? ', build: ' + names : '')
    + ' — prism.haohaop.com';
}

function copyReport() {
  const text = runReport();
  const done = () => { G.copied = 2.2; };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(done);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    }
  } catch (e) { done(); }
}

function loadStats() {
  try {
    const raw = localStorage.getItem(ST_KEY);
    if (raw) Object.assign(G.stats, JSON.parse(raw));
    const araw = localStorage.getItem(AC_KEY);
    if (araw) G.achs = JSON.parse(araw) || {};
  } catch (e) {}
}

function saveStats() {
  try { localStorage.setItem(ST_KEY, JSON.stringify(G.stats)); } catch (e) {}
  try { localStorage.setItem(AC_KEY, JSON.stringify(G.achs)); } catch (e) {}
}

function unlock(id) {
  if (G.achs[id]) return;
  G.achs[id] = 1;
  const a = ACHIEVEMENTS.find((x) => x.id === id);
  if (a) {
    G.achToast = a;
    G.achToastT = 2.6;
    Sound.card();
    saveStats();
  }
}

function checkAchievements() {
  const s = G.stats;
  if (s.wins > 0) unlock('clear');
  if (s.comboBest >= 25) unlock('combo');
  if (s.burstBest >= 12) unlock('burst');
  if (s.depthBest >= 15) unlock('deep');
  if (s.bricks >= 1000) unlock('grinder');
}

function loadBest() {
  try {
    G.best = parseInt(localStorage.getItem(HS_KEY) || '0', 10) || 0;
    G.bestFloor = parseInt(localStorage.getItem(HF_KEY) || '0', 10) || 0;
  } catch (e) { G.best = 0; G.bestFloor = 0; }
}

function saveBest() {
  if (G.score > G.best) {
    G.best = G.score;
    try { localStorage.setItem(HS_KEY, String(G.best)); } catch (e) {}
  }
  if (G.level > (G.bestFloor || 0)) {
    G.bestFloor = G.level;
    try { localStorage.setItem(HF_KEY, String(G.bestFloor)); } catch (e) {}
  }
  if (G.daily) {
    try {
      const prev = parseInt(localStorage.getItem(dailyKey()) || '0', 10) || 0;
      if (G.score > prev) localStorage.setItem(dailyKey(), String(G.score));
    } catch (e) {}
  }
}

/* --------------------------- geometry -------------------------- */

function bricksLeft() {
  let n = 0;
  for (const b of G.bricks) if (b.alive && b.breakable) n++;
  return n;
}

function ballSpeed() {
  const comboBoost = 1 + Math.min(G.combo || 0, 30) * 0.004;   // up to +12%
  const modBoost = G.mod && G.mod.speed ? G.mod.speed : 1;
  return clamp(520 + (G.level - 1) * 10, 520, 820) * G.upg.speedMul * comboBoost * modBoost;
}

function paddleWidth() {
  const debuff = G.paddleDebuff > 0 ? 0.72 : 1;
  return clamp(148 * G.upg.paddleMul * debuff, 96, 320);
}

/* -------------------------- level build ------------------------ */

function cellOn(pattern, r, c, rows, cols) {
  switch (pattern) {
    case 0: return true;
    case 1: return (r + c) % 2 === 0;
    case 2: return Math.abs(c - (cols - 1) / 2) <= (cols / 2) * (1 - r / (rows + 1));
    case 3: {
      const cx = (cols - 1) / 2, cy = (rows - 1) / 2;
      return Math.abs(c - cx) / (cols / 2) + Math.abs(r - cy) / (rows / 2) <= 1.05;
    }
    case 4: return (r === 0 || r === rows - 1 || c === 0 || c === cols - 1) ? true : (r + c) % 3 !== 1;
    case 5: return c % 4 !== 3;                                   // vertical lanes
    case 6: return (r + c) % 4 !== 0 || r % 2 === 0;              // diagonal weave
    case 7: {                                                     // prism pyramid
      const map = ['....#....', '...###...', '..#####..', '.#######.', '#########', '#########'];
      return map[Math.min(r, map.length - 1)][c] === '#';
    }
    case 8: {                                                     // hourglass
      const map = ['#########', '#########', '.##...##.', '..#####..', '...###...', '....#....'];
      return map[Math.min(r, map.length - 1)][c] === '#';
    }
    default: return true;
  }
}

function buildLevel(level) {
  const cols = 9, cw = 78, ch = 32, gap = 7;
  const totalW = cols * cw + (cols - 1) * gap;
  const startX = (W - totalW) / 2;
  const startY = 100;
  const rows = clamp(4 + Math.floor((level - 1) / 2), 4, 7);
  const pattern = (level - 1) % 9;
  const bricks = [];
  const sweepRow = level >= 4 ? rows - 1 : -1;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (!cellOn(pattern, r, c, rows, cols)) continue;

      let hp = 1;
      if (level >= 2 && (r + c) % 3 === 0) hp = 2;
      if (level >= 4 && (r * 3 + c) % 7 === 0) hp = 3;
      if (level >= 6 && r === 0) hp += 1;

      // indestructible strut: forces you out of a comfortable lane
      const steel = level >= 3 && hp === 1 && (c === 2 || c === 6) && r === Math.floor(rows / 2) && level % 2 === 1;

      let kind = 'plain';
      if (!steel) {
        const roll = (r * 7 + c * 11 + level * 5) % 29;
        if (level >= 3 && roll === 4) kind = 'regen';
        else if (level >= 2 && roll === 9) kind = 'core';
        else if (level >= 3 && roll === 15) kind = 'bomb';
      }

      const bx = startX + c * (cw + gap);
      // 2x2 clusters of the same tone: neighbouring bricks share a colour so
      // same-tone hits can actually light up and chain
      const tone = (Math.floor(r / 2) * 2 + Math.floor(c / 2) + level) % 3;
      const sweep = (r === sweepRow && level % 2 === 0)
        ? { amp: 24, speed: 0.5, phase: c * 0.25 }
        : null;

      bricks.push({
        x: bx,
        baseX: bx,
        y: startY + r * (ch + gap),
        w: cw,
        h: ch,
        hp: steel ? Infinity : hp,
        maxHp: steel ? Infinity : hp,
        breakable: !steel,
        alive: true,
        tone: steel ? -1 : tone,
        color: steel ? '#54628a' : TONES[tone].hex,
        dimColor: steel ? '#232b40' : TONES[tone].dim,
        kind,
        sweep,
        regenTimer: 0,
        flash: 0,
        lit: false,
        wobble: rand(0, TAU),
      });
    }
  }

  // boss floor: a core prism that stays immune until its shield plates are gone.
  // Every tenth floor throws two of them at you at once.
  if (level % 5 === 0) {
    const by = startY + rows * (ch + gap) + 10;
    const bossH = ch * 2 + gap;
    const sW = 58, sH = 22;
    const twin = level % 10 === 0;

    const pushBoss = (bx, bw, hp) => {
      bricks.push({
        x: bx, baseX: bx, y: by, w: bw, h: bossH,
        hp, maxHp: hp,
        breakable: true, alive: true, boss: true, tone: -1, kind: 'boss',
        color: twin ? '#ffd0d8' : '#ffe9a8', dimColor: twin ? '#7a2233' : '#6a4f14',
        sweep: null, regenTimer: 0, flash: 0, wobble: 0,
      });
      bricks.push({
        x: bx + bw / 2 - sW / 2, baseX: bx + bw / 2 - sW / 2, y: by + bossH + 10,
        w: sW, h: sH,
        hp: twin ? 2 : 3, maxHp: twin ? 2 : 3,
        breakable: true, alive: true, tone: -1, kind: 'shield',
        color: '#8fb0ff', dimColor: '#243a66',
        sweep: null, regenTimer: 0, flash: 0, wobble: 0,
      });
    };

    if (twin) {
      const bw2 = cw * 2 + gap;
      const spread = 64;
      const totalW = bw2 * 2 + spread;
      const x0 = (W - totalW) / 2;
      const hpEach = 5 + Math.floor(level / 5) * 2;
      pushBoss(x0, bw2, hpEach);
      pushBoss(x0 + bw2 + spread, bw2, hpEach);
    } else {
      const bw = cw * 4 + gap * 3;
      const bx = (W - bw) / 2;
      pushBoss(bx, bw, 6 + Math.floor(level / 5) * 3);
      // two extra side plates on the single core
      const sideY = by + bossH / 2 - sH / 2;
      for (const sx of [bx - sW - 12, bx + bw + 12]) {
        bricks.push({
          x: sx, baseX: sx, y: sideY, w: sW, h: sH,
          hp: 3, maxHp: 3,
          breakable: true, alive: true, tone: -1, kind: 'shield',
          color: '#8fb0ff', dimColor: '#243a66',
          sweep: null, regenTimer: 0, flash: 0, wobble: 0,
        });
      }
    }
  }

  return bricks;
}

/* --------------------------- ball spawn ------------------------ */

function spawnBall(stuck) {
  const p = G.paddle;
  const speed = ballSpeed();
  const angle = rand(-0.42, 0.42);
  return {
    x: p.x + rand(-p.w / 4, p.w / 4),
    y: p.y - G.upg.radius - 2,
    vx: Math.sin(angle) * speed,
    vy: -Math.cos(angle) * speed,
    r: G.upg.radius,
    stuck: !!stuck,
    pierces: G.upg.pierce,
    idle: 0,
    trail: [],
  };
}

function resetBalls() {
  G.balls = [];
  const n = 1 + G.upg.extraBalls;
  for (let i = 0; i < n; i++) {
    const b = spawnBall(true);
    b.x = G.paddle.x + (i - (n - 1) / 2) * 18;
    G.balls.push(b);
  }
}

function startRun(daily) {
  G.daily = !!daily;
  if (G.daily) seedRng(dailySeed()); else unseedRng();
  G.stats.runs += 1;
  saveStats();
  G.state = 'playing';
  G.level = 1;
  G.score = 0;
  G.lives = 3;
  G.combo = 0;
  G.comboTimer = 0;
  G.runReso = 0;
  G.toneChain = 0;
  G.runOdKills = 0;
  G.fusionCD = 0;
  G.fusionBeam = null;
  G.copied = 0;
  G.particles.length = 0;
  G.shards.length = 0;
  G.bolts.length = 0;
  G.floaters.length = 0;
  G.shake = 0;
  G.flash = 0;
  G.upg = freshUpgrades();
  G.tone = 0;
  G.charge = 0;
  G.slowTimer = 0;
  G.endless = false;
  G.paddle.w = paddleWidth();
  G.paddle.x = W / 2;
  G.paddle.targetX = W / 2;
  beginLevel();
}

function beginLevel() {
  G.mod = rollModifier(G.level);
  G.bricks = buildLevel(G.level);
  G.stats.depthBest = Math.max(G.stats.depthBest || 0, G.level);
  if (G.mod && G.mod.hp) {
    for (const b of G.bricks) {
      if (!b.breakable) continue;
      b.hp = Math.max(1, b.hp + G.mod.hp);
      b.maxHp = b.hp;
    }
  }
  G.shieldUsed = false;
  G.shieldLeft = G.upg.shield * (G.upg.aegis ? 2 : 1);
  G.balls = [];
  G.bolts.length = 0;
  G.hazards.length = 0;
  G.hazardTimer = 0;
  G.paddleDebuff = 0;
  G.layerBricks = 0;
  G.combo = 0;
  G.comboTimer = 0;
  G.paddle.w = paddleWidth();
  resetBalls();
  G.state = 'playing';
  Music.start();
  G.tip = G.level === 1 ? 5.5 : 0;
  burst(W / 2, H - 62, 14, '#54f2ff', 90);
}

/* --------------------------- particles ------------------------- */

function burst(x, y, n, color, speed) {
  if (G.particles.length > 420) n = Math.min(n, 6);
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU);
    const s = rand(speed * 0.35, speed);
    G.particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      life: rand(0.24, 0.62),
      max: 0.62,
      size: rand(1.6, 3.6),
      color,
    });
  }
}

function shockwave(x, y, color) {
  if (G.shockwaves.length > 24) return;
  G.shockwaves.push({ x, y, r: 8, life: 0.42, max: 0.42, color });
}

function haptic(ms) {
  if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
}

function debris(x, y, n, color) {
  if (G.shards.length > 90) return;
  for (let i = 0; i < n; i++) {
    G.shards.push({
      x, y,
      vx: rand(-170, 170),
      vy: rand(-280, -40),
      w: rand(4, 10),
      h: rand(3, 6),
      rot: rand(0, TAU),
      spin: rand(-9, 9),
      life: rand(0.7, 1.5),
      max: 1.5,
      color,
    });
  }
}

function floatText(x, y, text, color) {
  G.floaters.push({ x, y, text, color, life: 0.8, max: 0.8 });
}

/* --------------------------- damage ---------------------------- */

function blastAt(b) {
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  for (const o of G.bricks) {
    if (o === b || !o.alive || !o.breakable) continue;
    const ox = o.x + o.w / 2, oy = o.y + o.h / 2;
    if (Math.abs(ox - cx) < b.w * 1.15 + o.w / 2 && Math.abs(oy - cy) < b.h * 1.6 + o.h / 2) {
      damageBrick(o, 1, ox, oy, true, -1);
    }
  }
}

/* Lit bricks link up: hit same-tone bricks in a row and the connected cluster
   detonates as one chain. This is the damage engine of the game. */
function spreadFrom(b) {
  const tone = b.tone;
  const seen = new Set([b]);
  const stack = [b];
  const group = [b];
  while (stack.length) {
    const cur = stack.pop();
    const cx = cur.x + cur.w / 2, cy = cur.y + cur.h / 2;
    for (const o of G.bricks) {
      if (seen.has(o) || !o.alive || !o.breakable || !o.lit || o.tone !== tone) continue;
      const ox = o.x + o.w / 2, oy = o.y + o.h / 2;
      if (Math.abs(ox - cx) < cur.w * 1.15 && Math.abs(oy - cy) < cur.h * 1.7) {
        seen.add(o);
        stack.push(o);
        group.push(o);
      }
    }
  }
  return group;
}

function arcFrom(b, count) {
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  const targets = G.bricks
    .filter((o) => o.alive && o.breakable && o !== b)
    .map((o) => ({ o, d: Math.hypot(o.x + o.w / 2 - cx, o.y + o.h / 2 - cy) }))
    .sort((a, b2) => a.d - b2.d)
    .slice(0, count);
  for (const { o } of targets) {
    const ox = o.x + o.w / 2, oy = o.y + o.h / 2;
    for (let i = 0; i <= 6; i++) {
      const f2 = i / 6;
      burst(lerp(cx, ox, f2) + rand(-4, 4), lerp(cy, oy, f2) + rand(-4, 4), 1, '#bfe8ff', 30);
    }
    damageBrick(o, 1, ox, oy, true, -1);
  }
  Sound.laser();
}

function damageBrick(b, amount, fromX, fromY, chain, tone) {
  if (!b.alive || !b.breakable) return false;

  // a boss core only takes damage once its shield plates are gone
  if (b.boss && G.bricks.some((s) => s.kind === 'shield' && s.alive)) {
    if (G.floaters.length < 9) floatText(b.x + b.w / 2, b.y + 10, t('shielded'), '#8fb0ff');
    Sound.wall();
    return false;
  }

  for (const ball of G.balls) ball.idle = 0;

  let match = false;
  if (!chain && tone !== undefined && tone >= 0 && b.tone === tone) {
    match = true;
    G.runReso = (G.runReso || 0) + 1;
    amount *= 2 + (G.upg.resoBonus || 0);
    if (G.floaters.length < 5) floatText(b.x + b.w / 2, b.y - 4, t('resonance'), TONES[tone].hex);
    Sound.resonance();
  }

  // Three same-tone hits in a row detonate every brick of that tone on the floor.
  // Switch tone or hit an off-tone brick and the streak resets.
  if (!chain) {
    if (match) {
      G.toneChain = (G.toneChain || 0) + 1;
      b.lit = true;
      if (G.toneChain >= 3) {
        G.toneChain = 0;
        G.charge = Math.min(odMax(), G.charge + 12);
        if (G.floaters.length < 9) floatText(W / 2, H * 0.36, t('chain'), TONES[b.tone].hex);
        Sound.resonance();
        haptic(22);
        G.shake = Math.min(G.shake + 6, 16);
        G.flash = Math.max(G.flash, 0.35);
        for (const o of G.bricks) {
          if (o.alive && o.breakable && o.tone === b.tone) {
            burst(o.x + o.w / 2, o.y + o.h / 2, 6, TONES[b.tone].hex, 130);
            damageBrick(o, 1, o.x + o.w / 2, o.y + o.h / 2, true, -1);
          }
        }
      }
    } else if (!b.boss) {
      G.toneChain = 0;
    }
  }

  b.hp -= amount;
  b.flash = 1;

  // the core enrages at half health: faster orbs, and it opens with a volley
  if (b.boss && !b.phase2 && b.hp <= b.maxHp / 2 && b.hp > 0) {
    b.phase2 = true;
    G.flash = Math.max(G.flash, 0.75);
    G.shake = 16;
    Sound.tone(90, 0.55, 'sawtooth', 0.09, 42);
    haptic(50);
    if (G.floaters.length < 9) floatText(b.x + b.w / 2, b.y - 14, t('enraged'), '#ff4f6d');
    for (const f2 of [0.25, 0.75]) {
      G.hazards.push({ x: b.x + b.w * f2, y: b.y + b.h + 4, vy: 250, r: 9, spin: 0 });
    }
  }

  // a prism core brick swaps your light on contact
  if (b.kind === 'core' && !chain) {
    setTone((G.tone + (RNG() < 0.5 ? 1 : 2)) % 3);
    if (G.floaters.length < 9) floatText(b.x + b.w / 2, b.y + b.h + 16, t('prismShift'), '#ffffff');
  }

  if (b.hp > 0) {
    Sound.brick(Math.min(12, b.hp + Math.floor((G.combo || 0) / 4)));
    burst(fromX, fromY, 3, b.color, 90);
    return false;
  }

  b.alive = false;
  Sound.break_();
  G.combo += 1;
  G.comboTimer = 2.4;
  G.stats.bricks += 1;
  if (G.combo > (G.stats.comboBest || 0)) G.stats.comboBest = G.combo;
  const gain = Math.round((10 + b.maxHp * 6) * (1 + G.combo * 0.06) * (match ? 1.6 : 1)
    * (G.mod && G.mod.score ? G.mod.score : 1));
  G.score += gain;
  G.charge = Math.min(odMax(), (G.charge || 0) + (match ? 13 : 7) * (1 + (G.upg.chargeMul || 0)));
  burst(b.x + b.w / 2, b.y + b.h / 2, b.boss ? 46 : 14, b.color, b.boss ? 240 : 150);
  debris(b.x + b.w / 2, b.y + b.h / 2, b.boss ? 18 : 6, b.color);
  G.shake = Math.min(G.shake + (b.boss ? 11 : 3.2), 16);
  if (b.boss) haptic(35);
  G.hitstop = Math.max(G.hitstop, b.boss ? 0.07 : 0.014);
  if (G.combo > 2 && G.floaters.length < 9) floatText(b.x + b.w / 2, b.y + b.h / 2, 'x' + G.combo, b.color);

  // per-floor counters
  G.layerBricks = (G.layerBricks || 0) + 1;
  if (G.upg.vampire && G.layerBricks % 25 === 0) {
    G.lives += 1;
    if (G.floaters.length < 9) floatText(b.x + b.w / 2, b.y - 20, t('vampireHeal'), '#7dffb0');
    Sound.card();
  }

  // combo milestones top up the overdrive
  if ((G.combo === 15 || G.combo === 30) && G.balls.length < 8) {
    const nb2 = spawnBall(false);
    nb2.minion = true;
    nb2.life = 8;
    nb2.pierces = 0;
    G.balls.push(nb2);
    if (G.floaters.length < 9) floatText(W / 2, H * 0.46, t('combo') + ' ' + G.combo, '#ff4fd8');
  }
  if (G.combo === 10 || G.combo === 20 || G.combo === 30 || G.combo === 40) {
    G.charge = Math.min(odMax(), G.charge + 18);
    if (G.floaters.length < 9) floatText(W / 2, H * 0.42, t('combo') + ' ' + G.combo, '#ffd166');
    Sound.resonance();
  }

  if (!chain && G.upg.arc) arcFrom(b, G.upg.arc);

  // bombs chain on their own; the blast upgrade makes everything a bomb
  if ((G.upg.blast || b.kind === 'bomb') && !chain) blastAt(b);

  return true;
}

/* ---------------------------- input ---------------------------- */

function toLogic(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return {
    x: ((clientX - r.left) / Math.max(r.width, 1)) * W,
    y: ((clientY - r.top) / Math.max(r.height, 1)) * H,
  };
}

function pointerMove(clientX, clientY) {
  const p = toLogic(clientX, clientY);
  G.pointers.x = p.x;
  G.pointers.active = true;
  if (G.state === 'cardselect') {
    G.hoverCard = -1;
    for (let i = 0; i < G.cardRects.length; i++) {
      const r = G.cardRects[i];
      if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) G.hoverCard = i;
    }
  }
}

function launchStuck() {
  let launched = false;
  for (const b of G.balls) {
    if (!b.stuck) continue;
    b.stuck = false;
    const angle = rand(-0.38, 0.38);
    const s = ballSpeed();
    b.vx = Math.sin(angle) * s;
    b.vy = -Math.cos(angle) * s;
    launched = true;
  }
  if (launched) Sound.launch();
}

function onPointerDown(clientX, clientY) {
  Sound.init();
  Sound.resume();
  const p = toLogic(clientX, clientY);
  pointerMove(clientX, clientY);

  if (G.state === 'menu') {
    const dr = G.dailyRect;
    if (dr && p.x >= dr.x && p.x <= dr.x + dr.w && p.y >= dr.y && p.y <= dr.y + dr.h) {
      startRun(true);
      return;
    }
    const lr = G.langRect;
    if (lr && p.x >= lr.x && p.x <= lr.x + lr.w && p.y >= lr.y && p.y <= lr.y + lr.h) {
      setLang(LANG === 'zh' ? 'en' : 'zh');
      return;
    }
    startRun();
    return;
  }
  if (G.state === 'gameover') {
    const cr2 = G.copyRect;
    if (cr2 && p.x >= cr2.x && p.x <= cr2.x + cr2.w && p.y >= cr2.y && p.y <= cr2.y + cr2.h) {
      copyReport();
      return;
    }
    if (G.time - (G.deadAt || 0) > 0.6) startRun(G.daily);
    return;
  }
  if (G.state === 'paused') { G.state = 'playing'; return; }
  if (G.state === 'cardselect') {
    for (let i = 0; i < G.cardRects.length; i++) {
      const r = G.cardRects[i];
      if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) { chooseCard(i); return; }
    }
    return;
  }
  if (G.state === 'victory') {
    if (G.time - G.wonAt > 0.35) {
      G.endless = true;
      G.state = 'playing';
      beginLevel();
    }
    return;
  }
  if (G.portraitHint) { G.portraitDismissed = true; G.portraitHint = false; return; }
  if (G.state === 'playing') {
    const pr = G.pauseRect;
    if (pr && p.x >= pr.x && p.x <= pr.x + pr.w && p.y >= pr.y && p.y <= pr.y + pr.h) {
      G.state = 'paused';
      return;
    }
    const mr = G.muteRect;
    if (mr && p.x >= mr.x && p.x <= mr.x + mr.w && p.y >= mr.y && p.y <= mr.y + mr.h) {
      Sound.toggle();
      return;
    }
    const or2 = G.odRect;
    if (or2 && p.x >= or2.x && p.x <= or2.x + or2.w && p.y >= or2.y && p.y <= or2.y + or2.h) {
      if (G.charge >= odMax()) {
        tryOverdrive();
      } else {
        // tell the player why nothing happened
        const pct = Math.round((G.charge / odMax()) * 100);
        if (G.floaters.length < 9) floatText(W / 2, H - 60, t('overdrive') + ' ' + pct + '%', '#ffd166');
        Sound.shift();
        haptic(8);
      }
      return;
    }
    const fr = G.fuseRect;
    if (fr && p.x >= fr.x && p.x <= fr.x + fr.w && p.y >= fr.y && p.y <= fr.y + fr.h) {
      tryFusion();
      return;
    }
    for (const r of G.toneRects) {
      if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) { setTone(r.tone); return; }
    }
    launchStuck();
  }
}

function chooseCard(i) {
  const card = G.cardChoices[i];
  if (!card) return;
  card.apply(G.upg);
  G.upg.counts[card.id] = (G.upg.counts[card.id] || 0) + 1;
  if (card.id === 'life') G.lives += 1;
  G.paddle.w = paddleWidth();
  Sound.card();
  G.cardChoices = [];
  G.cardRects = [];
  G.level += 1;
  if (!G.endless && G.level > FINAL_FLOOR) {
    G.state = 'victory';
    Music.stop();
    G.wonAt = G.time;
    G.stats.wins = (G.stats.wins || 0) + 1;
    saveBest();
    saveStats();
    checkAchievements();
    Sound.level();
    return;
  }
  beginLevel();
  Sound.level();
  G.flash = Math.max(G.flash, 0.22);
}

function offeringCards() {
  const pool = [];
  for (const c of CARDS) {
    const used = G.upg.counts[c.id] || 0;
    if (used >= c.max) continue;
    pool.push(c);
  }
  // shuffle
  for (let i = pool.length - 1; i > 0; i--) {
    const j = (RNG() * (i + 1)) | 0;
    const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
  }
  return pool.slice(0, 3);
}

function setTone(t) {
  if (G.tone === t) return;
  G.toneChain = 0;
  G.tone = ((t % 3) + 3) % 3;
  Sound.shift();
  for (const b of G.balls) burst(b.x, b.y, 5, TONES[G.tone].hex, 70);
}

function odMax() { return G.upg.odMax || 100; }

/* FUSION: collapse every ball on the board into one vertical light beam.
   Multi-ball is the ammunition, so the strongest attack spends your safety net. */
function tryFusion() {
  if (G.state !== 'playing' || G.fusionCD > 0 || G.balls.length < 2) return;
  G.fusionCD = 12;
  G.balls.length = 0;
  G.fusionBeam = { x: G.paddle.x, t: 1.0, w: Math.max(96, G.paddle.w * 0.9), tick: 0 };
  G.flash = Math.max(G.flash, 0.5);
  G.shake = 12;
  Sound.overdrive();
  haptic(32);
  if (G.floaters.length < 9) floatText(W / 2, H * 0.34, t('fusion'), '#ffffff');
}

function updateFusion(dt) {
  if (G.fusionCD > 0) G.fusionCD = Math.max(0, G.fusionCD - dt);
  const fb = G.fusionBeam;
  if (!fb) return;
  fb.t -= dt;
  fb.tick -= dt;
  fb.x += (G.paddle.x - fb.x) * Math.min(1, dt * 6);
  if (fb.tick <= 0) {
    fb.tick = 0.11;
    for (const b of G.bricks) {
      if (!b.alive || !b.breakable) continue;
      const bx = b.x + b.w / 2;
      if (Math.abs(bx - fb.x) < fb.w / 2 + b.w / 2) {
        damageBrick(b, 1, bx, b.y + b.h / 2, true, -1);
      }
    }
  }
  if (fb.t <= 0) {
    G.fusionBeam = null;
    G.balls.push(spawnBall(true));
  }
}

function tryOverdrive() {
  if (G.state !== 'playing' || G.charge < odMax()) return;
  G.slowTimer = 1.15;
  G.flash = 1;
  G.shake = 16;
  haptic(45);
  Sound.overdrive();
  G.charge = 0;
  G.stats.overdrives = (G.stats.overdrives || 0) + 1;
  let burstKills = 0;
  for (const b of G.bricks) {
    if (b.alive && b.breakable) {
      if (damageBrick(b, G.upg.odDmg || 1, b.x + b.w / 2, b.y + b.h / 2, true, -1)) burstKills += 1;
    }
  }
  if (burstKills > (G.stats.burstBest || 0)) G.stats.burstBest = burstKills;
  G.runOdKills = (G.runOdKills || 0) + burstKills;
  checkAchievements();
  G.charge = 0;
  floatText(W / 2, H / 2 - 60, t('overdrive'), '#ffd166');
}

function enterCardSelect() {
  G.state = 'cardselect';
  G.flash = 0;
  G.cardChoices = offeringCards();
  G.hoverCard = -1;
}

/* ---------------------------- update --------------------------- */

function updatePaddle(dt) {
  const p = G.paddle;
  const half = p.w / 2;
  let target = p.targetX;

  const keys = G.keys || (G.keys = {});
  let kb = 0;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) kb -= 1;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) kb += 1;
  if (kb !== 0) {
    target = p.x + kb * 900 * dt;
    p.targetX = target;
  } else if (G.pointers.active) {
    target = G.pointers.x;
    p.targetX = target;
  }

  const prev = p.x;
  p.x = lerp(p.x, target, clamp(dt * 22, 0, 1));
  p.x = clamp(p.x, half, W - half);
  p.vx = (p.x - prev) / Math.max(dt, 0.0001);
}

function updateBalls(dt) {
  const p = G.paddle;
  for (let i = G.balls.length - 1; i >= 0; i--) {
    const b = G.balls[i];

    if (b.stuck) {
      b.x = clamp(b.x, p.x - p.w / 2 + 8, p.x + p.w / 2 - 8);
      b.y = p.y - b.r - 2;
      continue;
    }

    if (b.minion) {
      b.life -= dt;
      if (b.life <= 0) { G.balls.splice(i, 1); continue; }
    }

    // cushion: slow down in the bottom band
    let speedScale = 1;
    if (G.upg.cushion && b.vy > 0 && b.y > H - 190) speedScale = 0.62;

    const step = dt * speedScale;
    // sub-step to avoid tunnelling through thin bricks at high speed
    const dist = Math.hypot(b.vx, b.vy) * step;
    const steps = clamp(Math.ceil(dist / (b.r * 0.9)), 1, 6);
    const sdt = step / steps;

    for (let s = 0; s < steps; s++) {
      b.x += b.vx * sdt;
      b.y += b.vy * sdt;

      // walls
      if (b.x - b.r < 0) { b.x = b.r; b.vx = Math.abs(b.vx); Sound.wall(); }
      if (b.x + b.r > W) { b.x = W - b.r; b.vx = -Math.abs(b.vx); Sound.wall(); }
      if (b.y - b.r < 0) { b.y = b.r; b.vy = Math.abs(b.vy); Sound.wall(); }

      // bricks
      for (const br of G.bricks) {
        if (!br.alive) continue;
        const nearestX = clamp(b.x, br.x, br.x + br.w);
        const nearestY = clamp(b.y, br.y, br.y + br.h);
        const dx = b.x - nearestX, dy = b.y - nearestY;
        if (dx * dx + dy * dy > b.r * b.r) continue;

        let crit = false;
        let dmg = G.upg.dmg;
        if (G.upg.crit > 0 && RNG() < G.upg.crit) { crit = true; dmg *= 3; }

        const killed = damageBrick(br, dmg, b.x, b.y, false, G.tone);
        if (crit) floatText(b.x, b.y - 14, t('crit'), '#ffd166');

        // bounce resolution only for breakable bricks we did not punch through
        if (!br.breakable) {
          const overlapX = (b.r + br.w / 2) - Math.abs(b.x - (br.x + br.w / 2));
          const overlapY = (b.r + br.h / 2) - Math.abs(b.y - (br.y + br.h / 2));
          if (overlapX < overlapY) {
            b.vx = -b.vx;
            b.x += Math.sign(b.x - (br.x + br.w / 2)) * Math.max(overlapX, 0.1);
          } else {
            b.vy = -b.vy;
            b.y += Math.sign(b.y - (br.y + br.h / 2)) * Math.max(overlapY, 0.1);
          }
          break;
        }

        if (killed && b.pierces > 0) {
          // punch straight through the hole we just made
          b.pierces -= 1;
          continue;
        }

        if (killed) {
          // brick is gone: nudge out of the space and bounce on the dominant axis
          const overlapX = (b.r + br.w / 2) - Math.abs(b.x - (br.x + br.w / 2));
          const overlapY = (b.r + br.h / 2) - Math.abs(b.y - (br.y + br.h / 2));
          if (overlapX < overlapY) b.vx = -b.vx; else b.vy = -b.vy;
        } else {
          const overlapX = (b.r + br.w / 2) - Math.abs(b.x - (br.x + br.w / 2));
          const overlapY = (b.r + br.h / 2) - Math.abs(b.y - (br.y + br.h / 2));
          if (overlapX < overlapY) {
            b.vx = -b.vx;
            b.x += Math.sign(b.x - (br.x + br.w / 2)) * Math.max(overlapX, 0.1);
          } else {
            b.vy = -b.vy;
            b.y += Math.sign(b.y - (br.y + br.h / 2)) * Math.max(overlapY, 0.1);
          }
        }
        break;
      }

      // paddle
      if (b.vy > 0 && b.y + b.r >= p.y && b.y - b.r <= p.y + p.h + 4) {
        if (b.x >= p.x - p.w / 2 - b.r && b.x <= p.x + p.w / 2 + b.r) {
          let rel = clamp((b.x - p.x) / (p.w / 2), -1, 1);
          if (Math.abs(rel) < 0.09) rel = (RNG() < 0.5 ? -0.09 : 0.09);
          const angle = rel * 1.02;
          const sp = clamp(Math.hypot(b.vx, b.vy) * (1.008 + (G.upg.mirror || 0)), ballSpeed() * 0.94, ballSpeed() * 1.4);
          b.vx = Math.sin(angle) * sp + p.vx * 0.14;
          b.vy = -Math.abs(Math.cos(angle) * sp);
          b.y = p.y - b.r - 0.6;
          b.idle = Math.min(b.idle, 0.9);
          Sound.paddle();
          burst(b.x, p.y, 4, '#54f2ff', 80);
          shockwave(b.x, p.y, TONES[G.tone].hex);
          if (G.upg.fork > 0 && RNG() < G.upg.fork && G.balls.length < 9) {
            const nb = spawnBall(false);
            nb.x = b.x;
            nb.y = b.y;
            nb.r = Math.max(4, G.upg.radius * 0.68);
            nb.vx = b.vx * 0.55 + rand(-130, 130);
            nb.vy = b.vy;
            nb.minion = true;
            nb.life = 7;
            nb.pierces = 0;
            G.balls.push(nb);
            if (G.floaters.length < 9) floatText(b.x, p.y - 22, t('fork'), '#ffd166');
          }
        }
      }

      // floor / shield
      if (b.y - b.r > H) {
        if (G.shieldLeft > 0) {
          G.shieldLeft -= 1;
          G.shieldUsed = true;
          b.y = H - b.r - 4;
          b.vy = -Math.abs(b.vy);
          burst(b.x, H - 6, 22, '#8b5cf6', 190);
          G.shake = 8;
          Sound.card();
        } else {
          G.balls.splice(i, 1);
          break;
        }
      }
    }

    if (G.balls[i] !== b) continue;

    // clamp speed so physics never drifts
    const sp = Math.hypot(b.vx, b.vy);
    const target = clamp(sp, ballSpeed() * 0.94, ballSpeed() * 1.3);
    if (sp > 0) { b.vx = (b.vx / sp) * target; b.vy = (b.vy / sp) * target; }

    // seeker: curve gently toward the nearest brick while in the upper field
    if (G.upg.seek > 0 && b.y < H * 0.72) {
      let target = null, bestD = Infinity;
      for (const br of G.bricks) {
        if (!br.alive || !br.breakable) continue;
        const dx = br.x + br.w / 2 - b.x, dy = br.y + br.h / 2 - b.y;
        const d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; target = br; }
      }
      if (target) {
        const want = Math.atan2(target.y + target.h / 2 - b.y, target.x + target.w / 2 - b.x);
        const cur = Math.atan2(b.vy, b.vx);
        let diff = want - cur;
        while (diff > Math.PI) diff -= TAU;
        while (diff < -Math.PI) diff += TAU;
        const sp = Math.hypot(b.vx, b.vy);
        const na = cur + clamp(diff, -1.6, 1.6) * 0.006 * G.upg.seek * dt * 60;
        b.vx = Math.cos(na) * sp;
        b.vy = Math.sin(na) * sp;
      }
    }

    // anti-stall: a nearly horizontal ball can ping forever between the walls
    const minVy = target * 0.32;
    if (Math.abs(b.vy) < minVy) {
      b.vy = (b.vy >= 0 ? 1 : -1) * minVy;
      const rescale = target / Math.hypot(b.vx, b.vy);
      b.vx *= rescale;
      b.vy *= rescale;
    }

    // anti-stall: a ball grazing the empty band above the bricks can loop forever.
    // If it has not hit a brick or the paddle for a while, shove it back in.
    b.idle += dt;
    if (b.idle > 2.2) {
      b.idle = 0;
      const sp = Math.max(Math.hypot(b.vx, b.vy), target);
      const downward = b.y < H * 0.6;
      const a = downward ? rand(-0.85, 0.85) : rand(Math.PI - 0.85, Math.PI + 0.85);
      b.vx = Math.sin(a) * sp;
      b.vy = Math.cos(a) * sp;
      burst(b.x, b.y, 5, '#ffd166', 60);
    }

    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 9) b.trail.shift();
  }

  if (G.balls.length === 0 && !G.fusionBeam) {
    G.lives -= 1;
    G.shake = 12;
    G.flash = 0.6;
    Sound.lose();
    if (G.lives <= 0) {
      G.state = 'gameover';
      G.tip = 0;
      Music.stop();
      G.deadAt = G.time;
      haptic(60);
      saveBest();
      saveStats();
      checkAchievements();
    } else {
      G.combo = 0;
      resetBalls();
    }
  }
}

function updateHazards(dt) {
  const boss = G.bricks.find((b) => b.boss && b.alive);
  if (boss) {
    G.hazardTimer += dt;
    if (G.hazardTimer > (boss.phase2 ? 3.6 : 7)) {
      G.hazardTimer = 0;
      G.hazards.push({ x: boss.x + rand(20, boss.w - 20), y: boss.y + boss.h + 4, vy: 230, r: 9, spin: 0 });
      Sound.tone(190, 0.22, 'sawtooth', 0.05, 90);
    }
  }
  const p = G.paddle;
  for (let i = G.hazards.length - 1; i >= 0; i--) {
    const h = G.hazards[i];
    h.y += h.vy * dt;
    h.vy = Math.min(h.vy + 40 * dt, 330);
    h.spin += dt * 6;
    if (h.y > H + 24) { G.hazards.splice(i, 1); continue; }
    if (h.y + h.r > p.y && h.y - h.r < p.y + p.h && Math.abs(h.x - p.x) < p.w / 2 + h.r) {
      G.paddleDebuff = 3.2;
      G.paddle.w = paddleWidth();
      burst(h.x, h.y, 16, '#ff4f6d', 170);
      haptic(30);
      Sound.lose();
      G.hazards.splice(i, 1);
    }
  }
  if (G.paddleDebuff > 0) {
    G.paddleDebuff -= dt;
    if (G.paddleDebuff <= 0) {
      G.paddleDebuff = 0;
      G.paddle.w = paddleWidth();
    }
  }
}

function updateBolts(dt) {
  if (G.upg.laser > 0) {
    G.laserTimer = (G.laserTimer || 0) + dt;
    const period = (1.7 / G.upg.laser) * (G.upg.lance ? 0.75 : 1);
    if (G.laserTimer > period) {
      G.laserTimer = 0;
      const p = G.paddle;
      G.bolts.push({ x: p.x - p.w / 2 + 8, y: p.y - 6, vy: -720 });
      G.bolts.push({ x: p.x + p.w / 2 - 8, y: p.y - 6, vy: -720 });
      if (G.upg.lance) G.bolts.push({ x: p.x, y: p.y - 6, vy: -780 });
      Sound.laser();
    }
  }
  for (let i = G.bolts.length - 1; i >= 0; i--) {
    const bo = G.bolts[i];
    bo.y += bo.vy * dt;
    if (bo.y < -20) { G.bolts.splice(i, 1); continue; }
    for (const br of G.bricks) {
      if (!br.alive) continue;
      if (bo.x >= br.x && bo.x <= br.x + br.w && bo.y >= br.y && bo.y <= br.y + br.h) {
        damageBrick(br, 1, bo.x, bo.y, false, G.tone);
        G.bolts.splice(i, 1);
        break;
      }
    }
  }
}

function updateParticles(dt) {
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const p = G.particles[i];
    p.life -= dt;
    if (p.life <= 0) { G.particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.965;
    p.vy = p.vy * 0.965 + 260 * dt;
  }
  for (let i = G.shockwaves.length - 1; i >= 0; i--) {
    const s = G.shockwaves[i];
    s.life -= dt;
    s.r += 460 * dt;
    if (s.life <= 0) G.shockwaves.splice(i, 1);
  }
  for (let i = G.shards.length - 1; i >= 0; i--) {
    const s = G.shards[i];
    s.life -= dt;
    if (s.life <= 0) { G.shards.splice(i, 1); continue; }
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.vy += 760 * dt;
    s.vx *= 0.99;
    s.rot += s.spin * dt;
  }
  for (let i = G.floaters.length - 1; i >= 0; i--) {
    const f = G.floaters[i];
    f.life -= dt;
    f.y -= 34 * dt;
    if (f.life <= 0) G.floaters.splice(i, 1);
  }
}

function update(dt) {
  G.time += dt;
  if (G.tip > 0) G.tip = Math.max(0, G.tip - dt);
  if (G.slowTimer > 0) {
    G.slowTimer -= dt;
    dt *= 0.34;
  }

  if (G.hitstop > 0) { G.hitstop -= dt; dt = Math.max(dt - 0.014, 0.0005); }
  G.shake = Math.max(0, G.shake - dt * 34);
  G.flash = Math.max(0, G.flash - dt * 2.2);

  for (const br of G.bricks) {
    if (br.flash > 0) br.flash = Math.max(0, br.flash - dt * 5);
    br.wobble += dt * 2;
    if (br.sweep) {
      br.x = br.baseX + Math.sin(G.time * br.sweep.speed + br.sweep.phase) * br.sweep.amp;
    }
    if (br.kind === 'regen' && br.alive && br.breakable && br.hp < br.maxHp && G.state === 'playing') {
      br.regenTimer = (br.regenTimer || 0) + dt;
      if (br.regenTimer > 6.5) {
        br.regenTimer = 0;
        br.hp = Math.min(br.maxHp, br.hp + 1);
        br.flash = 0.8;
        burst(br.x + br.w / 2, br.y + br.h / 2, 8, '#7dffb0', 90);
        if (G.floaters.length < 9) floatText(br.x + br.w / 2, br.y - 4, t('regrow'), '#7dffb0');
      }
    }
  }

  if (G.state === 'playing') {
    updatePaddle(dt);
    updateBalls(dt);
    updateBolts(dt);
    updateHazards(dt);
    updateFusion(dt);
    if (G.comboTimer > 0) {
      G.comboTimer -= dt;
      if (G.comboTimer <= 0) G.combo = 0;
    }
    if (G.state === 'playing' && bricksLeft() === 0) {
      enterCardSelect();
    }
  } else if (G.state === 'cardselect') {
    updatePaddle(dt);
  }
  updateParticles(dt);
}

/* ---------------------------- render --------------------------- */

function drawBackground() {
  const th = themeFor(G.level);
  ctx.fillStyle = th.bg;
  ctx.fillRect(0, 0, W, H);

  // slow drifting grid
  const g = 48;
  const off = (G.time * 14) % g;
  ctx.strokeStyle = th.grid;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = -off; x < W + g; x += g) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = -off; y < H + g; y += g) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  // vignette
  const vg = ctx.createRadialGradient(W / 2, H / 2, 120, W / 2, H / 2, 640);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.62)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

function drawBricks() {
  for (const b of G.bricks) {
    if (!b.alive) continue;
    const hpRatio = b.breakable ? clamp(b.hp / b.maxHp, 0, 1) : 1;
    const grd = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
    if (b.breakable) {
      grd.addColorStop(0, b.color);
      grd.addColorStop(1, b.dimColor || 'rgba(6,8,18,0.92)');
    } else {
      grd.addColorStop(0, '#2a3247');
      grd.addColorStop(1, '#141a28');
    }
    ctx.globalAlpha = b.breakable ? 0.34 + hpRatio * 0.46 : 1;
    ctx.fillStyle = grd;
    roundedRect(ctx, b.x, b.y, b.w, b.h, 5);
    ctx.fill();

    ctx.globalAlpha = 1;
    ctx.strokeStyle = b.breakable ? b.color : '#7b8cb5';
    ctx.lineWidth = b.flash > 0 ? 2.6 : 1.4;
    ctx.globalAlpha = b.breakable ? 0.65 + (b.flash * 0.35) : 0.85;
    roundedRect(ctx, b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1, 5);
    ctx.stroke();
    ctx.globalAlpha = 1;

    if (b.lit) {
      ctx.globalAlpha = 0.35 + Math.abs(Math.sin(b.wobble * 3)) * 0.45;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.4;
      roundedRect(ctx, b.x + 1, b.y + 1, b.w - 2, b.h - 2, 5);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // top bevel
    ctx.globalAlpha = b.breakable ? 0.5 : 0.25;
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(b.x + 5, b.y + 1.5);
    ctx.lineTo(b.x + b.w - 5, b.y + 1.5);
    ctx.stroke();
    ctx.globalAlpha = 1;

    if (b.flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (b.flash * 0.5) + ')';
      roundedRect(ctx, b.x, b.y, b.w, b.h, 5);
      ctx.fill();
    }

    // tough bricks get a heavier top bar instead of hp dots
    if (b.breakable && b.maxHp > 1 && b.kind === 'plain' && b.hp < b.maxHp && !(G.mod && G.mod.blackout)) {
      const filled = clamp(b.hp / b.maxHp, 0, 1);
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = 'rgba(255,255,255,' + (0.55 + filled * 0.4) + ')';
      ctx.fillRect(b.x + 6, b.y + b.h - 5, (b.w - 12) * filled, 2.5);
      ctx.globalAlpha = 1;
    }

    if (b.kind === 'regen') {
      ctx.fillStyle = 'rgba(125,255,176,' + (0.55 + Math.abs(Math.sin(b.wobble * 3)) * 0.4) + ')';
      ctx.beginPath();
      ctx.arc(b.x + b.w - 9, b.y + 9, 3, 0, TAU);
      ctx.fill();
    } else if (b.kind === 'bomb') {
      ctx.fillStyle = 'rgba(255,90,90,0.95)';
      ctx.beginPath();
      ctx.arc(b.x + b.w / 2, b.y + b.h / 2, 4.5, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,90,90,0.55)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(b.x + b.w / 2, b.y + b.h / 2, 8.5, 0, TAU);
      ctx.stroke();
    } else if (b.kind === 'core') {
      ctx.strokeStyle = 'rgba(255,255,255,0.92)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(b.x + b.w / 2, b.y + b.h / 2 - 8);
      ctx.lineTo(b.x + b.w / 2 + 7, b.y + b.h / 2);
      ctx.lineTo(b.x + b.w / 2, b.y + b.h / 2 + 8);
      ctx.lineTo(b.x + b.w / 2 - 7, b.y + b.h / 2);
      ctx.closePath();
      ctx.stroke();
    } else if (b.kind === 'shield') {
      ctx.strokeStyle = 'rgba(160,190,255,0.95)';
      ctx.lineWidth = 2;
      roundedRect(ctx, b.x + 1, b.y + 1, b.w - 2, b.h - 2, 5);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(230,242,255,0.85)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(b.x + b.w / 2, b.y + 5);
      ctx.lineTo(b.x + b.w / 2, b.y + b.h - 5);
      ctx.stroke();
    }

    if (b.boss) {
      const hot = b.phase2 ? '255,79,109' : '255,204,77';
      ctx.strokeStyle = 'rgba(' + hot + ',' + (0.35 + Math.sin(b.wobble * (b.phase2 ? 5 : 2)) * 0.3) + ')';
      ctx.lineWidth = 2;
      roundedRect(ctx, b.x - 3, b.y - 3, b.w + 6, b.h + 6, 8);
      ctx.stroke();
    }
  }
}

function drawPaddle() {
  const p = G.paddle;
  const x = p.x - p.w / 2;

  const g = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
  g.addColorStop(0, '#eafcff');
  g.addColorStop(0.42, '#54f2ff');
  g.addColorStop(1, '#1b6fa8');
  ctx.fillStyle = g;
  roundedRect(ctx, x, p.y, p.w, p.h, p.h / 2);
  ctx.fill();

  ctx.globalAlpha = 0.28;
  ctx.fillStyle = TONES[G.tone].hex;
  roundedRect(ctx, x - 6, p.y - 5, p.w + 12, p.h + 12, p.h);
  ctx.fill();
  ctx.globalAlpha = 1;

  if (G.upg && G.shieldLeft > 0) {
    ctx.strokeStyle = 'rgba(139,92,246,' + (0.5 + Math.sin(G.time * 5) * 0.22) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(8, H - 6);
    ctx.lineTo(W - 8, H - 8);
    ctx.stroke();
  }
}

function drawBalls() {
  for (const b of G.balls) {
    const toneHex = TONES[G.tone].hex;
    for (let i = 0; i < b.trail.length; i++) {
      const t = b.trail[i];
      const a = (i / b.trail.length) * 0.4;
      ctx.globalAlpha = a;
      ctx.fillStyle = toneHex;
      ctx.beginPath();
      ctx.arc(t.x, t.y, b.r * (0.3 + (i / b.trail.length) * 0.6), 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    const gl = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 2.8);
    gl.addColorStop(0, 'rgba(255,255,255,0.95)');
    gl.addColorStop(0.45, toneHex + 'a0');
    gl.addColorStop(1, toneHex + '00');
    ctx.fillStyle = gl;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * 2.8, 0, TAU);
    ctx.fill();

    ctx.fillStyle = '#f2feff';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * 0.72, 0, TAU);
    ctx.fill();
  }
}

function drawFusionBeam() {
  const fb = G.fusionBeam;
  if (!fb) return;
  const a = clamp(fb.t, 0, 1);
  const grd = ctx.createLinearGradient(fb.x - fb.w / 2, 0, fb.x + fb.w / 2, 0);
  grd.addColorStop(0, 'rgba(255,255,255,0)');
  grd.addColorStop(0.5, 'rgba(255,255,255,' + (0.72 * a).toFixed(3) + ')');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(fb.x - fb.w / 2, 0, fb.w, G.paddle.y);
  ctx.fillStyle = 'rgba(255,255,255,' + (0.92 * a).toFixed(3) + ')';
  ctx.fillRect(fb.x - 3, 0, 6, G.paddle.y);
}

function drawHazards() {
  for (const h of G.hazards) {
    ctx.save();
    ctx.translate(h.x, h.y);
    ctx.rotate(h.spin);
    ctx.fillStyle = 'rgba(255,79,109,0.92)';
    ctx.beginPath();
    ctx.moveTo(0, -h.r);
    ctx.lineTo(h.r * 0.8, 0);
    ctx.lineTo(0, h.r);
    ctx.lineTo(-h.r * 0.8, 0);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,180,190,0.9)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.restore();
  }
}

function drawBolts() {
  ctx.strokeStyle = '#ffd166';
  ctx.lineWidth = 3;
  for (const b of G.bolts) {
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x, b.y + 16);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawShockwaves() {
  for (const s of G.shockwaves) {
    const a = clamp(s.life / s.max, 0, 1);
    ctx.globalAlpha = a * 0.5;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 2.5 * a;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, Math.PI, TAU);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawShards() {
  for (const s of G.shards) {
    const a = clamp(s.life / s.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = s.color;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);
    ctx.fillRect(-s.w / 2, -s.h / 2, s.w, s.h);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawParticles() {
  for (const p of G.particles) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawFloaters() {
  ctx.textAlign = 'center';
  ctx.font = '700 16px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
  for (const f of G.floaters) {
    const a = clamp(f.life / f.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawHud() {
  ctx.textAlign = 'left';
  ctx.font = '700 13px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(160,180,210,0.85)';
  ctx.fillText(t('score'), 20, 30);
  ctx.font = '700 26px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#eafcff';
  ctx.fillText(String(G.score).padStart(5, '0'), 20, 54);

  ctx.textAlign = 'right';
  ctx.font = '700 13px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(160,180,210,0.85)';
  ctx.fillText(t('best'), W - 20, 30);
  ctx.font = '700 26px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#54f2ff';
  ctx.fillText(String(Math.max(G.best, G.score)).padStart(5, '0'), W - 20, 54);

  ctx.textAlign = 'center';
  ctx.font = '700 13px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(160,180,210,0.85)';
  ctx.fillText(t('floor'), W / 2, 30);
  ctx.font = '700 26px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#ff4fd8';
  ctx.fillText((G.endless ? '' : Math.min(G.level, FINAL_FLOOR) + '/') + (G.endless ? String(G.level) : FINAL_FLOOR), W / 2, 54);

  // lives (top-left, under the score)
  ctx.textAlign = 'left';
  for (let i = 0; i < Math.min(G.lives, 9); i++) {
    ctx.fillStyle = '#ff4f6d';
    ctx.beginPath();
    ctx.arc(24 + i * 15, 76, 4.5, 0, TAU);
    ctx.fill();
  }

  if (G.mod) {
    ctx.textAlign = 'left';
    ctx.font = '700 12px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = 'rgba(255,209,102,0.9)';
    ctx.fillText(modName(G.mod) + '  ·  ' + modDesc(G.mod), 20, 100);
  }

  for (let i = 0; i < (G.shieldLeft || 0); i++) {
    ctx.fillStyle = 'rgba(139,92,246,0.9)';
    ctx.fillRect(20 + i * 13, 86, 9, 9);
  }

  // ---- light selector (bottom-left, below the paddle's travel) ----
  G.toneRects = [];
  ctx.textAlign = 'left';
  ctx.font = '700 10px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(150,170,200,0.72)';
  ctx.fillText(t('light') + '  Q / E', 20, H - 30);
  for (let i = 0; i < 3; i++) {
    const bx = 20 + i * 46, by = H - 24, bw = 40, bh = 18;
    G.toneRects.push({ x: bx, y: by, w: bw, h: bh, tone: i });
    const active = G.tone === i;
    ctx.globalAlpha = active ? 1 : 0.3;
    ctx.fillStyle = TONES[i].hex;
    roundedRect(ctx, bx, by, bw, bh, 5);
    ctx.fill();
    ctx.globalAlpha = 1;
    if (active) {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      roundedRect(ctx, bx + 1, by + 1, bw - 2, bh - 2, 4);
      ctx.stroke();
    }
  }

  // ---- pause / mute chips (touch playable) ----
  const chW = 34, chH = 24;
  const pauseX = W - 20 - chW, muteX = pauseX - chW - 8, chY = 58;
  G.pauseRect = { x: pauseX, y: chY, w: chW, h: chH };
  G.muteRect = { x: muteX, y: chY, w: chW, h: chH };
  for (const [rx, kind] of [[pauseX, 'pause'], [muteX, 'mute']]) {
    ctx.strokeStyle = 'rgba(150,170,200,0.35)';
    ctx.lineWidth = 1.2;
    roundedRect(ctx, rx, chY, chW, chH, 7);
    ctx.stroke();
  }
  // pause glyph
  ctx.fillStyle = 'rgba(200,215,235,0.85)';
  ctx.fillRect(pauseX + 12, chY + 7, 4, 10);
  ctx.fillRect(pauseX + 19, chY + 7, 4, 10);
  // speaker glyph
  ctx.beginPath();
  ctx.moveTo(muteX + 10, chY + 9);
  ctx.lineTo(muteX + 14, chY + 9);
  ctx.lineTo(muteX + 19, chY + 5);
  ctx.lineTo(muteX + 19, chY + 19);
  ctx.lineTo(muteX + 14, chY + 15);
  ctx.lineTo(muteX + 10, chY + 15);
  ctx.closePath();
  ctx.fill();
  if (Sound.on) {
    ctx.strokeStyle = 'rgba(200,215,235,0.85)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(muteX + 20, chY + 12, 5, -0.9, 0.9);
    ctx.stroke();
  } else {
    ctx.strokeStyle = '#ff4f6d';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(muteX + 9, chY + 5);
    ctx.lineTo(muteX + 24, chY + 19);
    ctx.moveTo(muteX + 24, chY + 5);
    ctx.lineTo(muteX + 9, chY + 19);
    ctx.stroke();
  }

  // ---- fusion slot (next to the light swatches) ----
  const fx = 172, fy = H - 24, fw = 96, fh = 18;
  G.fuseRect = { x: fx, y: fy, w: fw, h: fh };
  const fuseReady = G.fusionCD <= 0 && G.balls.length >= 2;
  ctx.globalAlpha = fuseReady ? 1 : 0.35;
  ctx.strokeStyle = fuseReady ? '#ffffff' : 'rgba(160,180,210,0.7)';
  ctx.lineWidth = 1.4;
  roundedRect(ctx, fx, fy, fw, fh, 5);
  ctx.stroke();
  ctx.textAlign = 'center';
  ctx.font = '700 11px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
  ctx.fillStyle = fuseReady ? '#ffffff' : 'rgba(200,215,235,0.8)';
  const fuseText = G.fusionCD > 0
    ? t('fusionCool') + ' ' + Math.ceil(G.fusionCD) + 's'
    : t('fusionReady');
  ctx.fillText(fuseText, fx + fw / 2, fy + 13);
  ctx.globalAlpha = 1;

  // ---- overdrive meter (bottom-centre) ----
  const mw = 250, mx = W / 2 - mw / 2, my = H - 26, mh = 9;
  G.odRect = { x: mx - 10, y: my - 24, w: mw + 20, h: mh + 44 };
  ctx.fillStyle = 'rgba(255,255,255,0.09)';
  roundedRect(ctx, mx, my, mw, mh, 4.5);
  ctx.fill();
  const full = G.charge >= odMax();
  const cg = ctx.createLinearGradient(mx, 0, mx + mw, 0);
  cg.addColorStop(0, TONES[0].hex);
  cg.addColorStop(0.5, TONES[1].hex);
  cg.addColorStop(1, TONES[2].hex);
  ctx.globalAlpha = full ? 0.55 + Math.abs(Math.sin(G.time * 6)) * 0.45 : 0.9;
  ctx.fillStyle = cg;
  roundedRect(ctx, mx, my, Math.max(5, mw * clamp(G.charge / odMax(), 0, 1)), mh, 4.5);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  ctx.font = '700 10px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
  ctx.fillStyle = full ? '#ffd166' : 'rgba(150,170,200,0.75)';
  ctx.fillText(full ? t('odReady') : t('overdrive'), W / 2, my - 6);
  if (full) {
    ctx.strokeStyle = 'rgba(255,209,102,' + (0.4 + Math.abs(Math.sin(G.time * 6)) * 0.5) + ')';
    ctx.lineWidth = 1.6;
    roundedRect(ctx, mx - 4, my - 4, mw + 8, mh + 8, mh);
    ctx.stroke();
  }

  // achievement toast
  if (G.achToastT > 0 && G.achToast) {
    G.achToastT -= 1 / 60;
    const a = clamp(G.achToastT / 0.6, 0, 1);
    ctx.globalAlpha = a;

function drawCardSelect() {
  ctx.fillStyle = 'rgba(4,5,12,0.86)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.font = '800 16px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#54f2ff';
  ctx.fillText(t('cleared', G.level), W / 2, 104);
  ctx.font = '800 30px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#eafcff';
  ctx.fillText(t('chooseOne'), W / 2, 142);

  const cwv = 250, chv = 300, gap = 26;
  const totalW = G.cardChoices.length * cwv + (G.cardChoices.length - 1) * gap;
  const x0 = (W - totalW) / 2;
  const y0 = 196;
  G.cardRects = [];

  G.cardChoices.forEach((card, i) => {
    const x = x0 + i * (cwv + gap);
    const hovered = G.hoverCard === i;
    const lift = hovered ? -10 : 0;
    const rect = { x, y: y0, w: cwv, h: chv };
    G.cardRects.push(rect);

    const look = CARD_LOOK[card.tag] || CARD_LOOK.OFFENSE;

    ctx.save();
    ctx.translate(0, lift);

    // card body
    const g = ctx.createLinearGradient(x, y0, x, y0 + chv);
    g.addColorStop(0, 'rgba(18,24,40,0.98)');
    g.addColorStop(1, 'rgba(9,12,22,0.98)');
    ctx.fillStyle = g;
    roundedRect(ctx, x, y0, cwv, chv, 16);
    ctx.fill();

    ctx.strokeStyle = hovered ? look[0] : 'rgba(120,140,175,0.42)';
    ctx.lineWidth = hovered ? 2.6 : 1.4;
    roundedRect(ctx, x + 0.5, y0 + 0.5, cwv - 1, chv - 1, 16);
    ctx.stroke();

    // top accent
    const ac = ctx.createLinearGradient(x, y0, x + cwv, y0);
    ac.addColorStop(0, look[0]);
    ac.addColorStop(1, look[1]);
    ctx.fillStyle = ac;
    roundedRect(ctx, x + 0.5, y0 + 0.5, cwv - 1, 5, 3);
    ctx.fill();

    // icon
    ctx.save();
    ctx.translate(x + cwv / 2, y0 + 78);
    drawCardIcon(card.id, look);
    ctx.restore();

    // tag
    ctx.textAlign = 'center';
    ctx.font = '700 11px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = look[0];
    ctx.fillText(cardTagLabel(card.tag), x + cwv / 2, y0 + 128);

    // name
    ctx.font = '900 27px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#f0f7ff';
    ctx.fillText(LANG === 'zh' && card.zh ? card.zh : card.name, x + cwv / 2, y0 + 168);

    // desc
    ctx.font = '600 14px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = 'rgba(190,205,225,0.88)';
    const usedLv = G.upg.counts[card.id] || 0;
    const descText = LANG === 'zh' && card.descZh
      ? card.descZh(usedLv)
      : card.desc(usedLv);
    wrapText(descText, x + cwv / 2, y0 + 208, cwv - 44, 21);

    // stack indicator
    const used = G.upg.counts[card.id] || 0;
    if (used > 0) {
      ctx.font = '700 12px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
      ctx.fillStyle = 'rgba(255,209,102,0.9)';
      ctx.fillText(t('lv', used, used + 1), x + cwv / 2, y0 + chv - 52);
    }

    // key hint
    ctx.font = '800 13px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = hovered ? look[0] : 'rgba(140,158,190,0.6)';
    ctx.fillText('[ ' + (i + 1) + ' ]', x + cwv / 2, y0 + chv - 24);

    ctx.restore();
  });

  ctx.textAlign = 'center';
  ctx.font = '600 13px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(150,170,200,0.6)';
  ctx.fillText(t('pickHint'), W / 2, H - 52);
}

function drawCardIcon(id, look) {
  ctx.strokeStyle = look[0];
  ctx.fillStyle = look[0];
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  switch (id) {
    case 'twin':
      for (const dx of [-13, 13]) { ctx.beginPath(); ctx.arc(dx, 0, 10, 0, TAU); ctx.stroke(); }
      break;
    case 'wide':
      roundedRect(ctx, -34, -7, 68, 14, 7); ctx.stroke();
      break;
    case 'heavy':
      ctx.beginPath(); ctx.moveTo(-8, -22); ctx.lineTo(12, -22); ctx.lineTo(2, 20); ctx.lineTo(-14, 20); ctx.closePath(); ctx.stroke();
      break;
    case 'pierce':
      ctx.beginPath(); ctx.moveTo(-30, 0); ctx.lineTo(26, 0); ctx.moveTo(14, -10); ctx.lineTo(28, 0); ctx.lineTo(14, 10); ctx.stroke();
      break;
    case 'blast':
      for (let a = 0; a < 8; a++) {
        const ang = (a / 8) * TAU;
        ctx.beginPath();
        ctx.moveTo(Math.cos(ang) * 10, Math.sin(ang) * 10);
        ctx.lineTo(Math.cos(ang) * 26, Math.sin(ang) * 26);
        ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(0, 0, 7, 0, TAU); ctx.fill();
      break;
    case 'laser':
      ctx.beginPath(); ctx.moveTo(-20, 16); ctx.lineTo(-20, -18); ctx.moveTo(20, 16); ctx.lineTo(20, -18); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-20, 16); ctx.lineTo(20, 16); ctx.stroke();
      break;
    case 'crit':
      ctx.beginPath();
      for (let a = 0; a < 10; a++) {
        const ang = -Math.PI / 2 + (a / 10) * TAU;
        const rr = a % 2 === 0 ? 26 : 11;
        const px = Math.cos(ang) * rr, py = Math.sin(ang) * rr;
        if (a === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.stroke();
      break;
    case 'feather':
      ctx.beginPath(); ctx.moveTo(-22, 14); ctx.quadraticCurveTo(0, -26, 24, -6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-22, 14); ctx.lineTo(24, -6); ctx.stroke();
      break;
    case 'giant':
      ctx.beginPath(); ctx.arc(0, 0, 22, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 9, 0, TAU); ctx.fill();
      break;
    case 'cushion':
      ctx.beginPath(); ctx.moveTo(-30, -8); ctx.quadraticCurveTo(0, 26, 30, -8); ctx.stroke();
      break;
    case 'shield':
      ctx.beginPath(); ctx.moveTo(0, -24); ctx.lineTo(24, -12); ctx.lineTo(24, 8); ctx.quadraticCurveTo(0, 30, -24, 8); ctx.lineTo(-24, -12); ctx.closePath(); ctx.stroke();
      break;
    case 'life':
      ctx.beginPath();
      ctx.moveTo(0, 18);
      ctx.bezierCurveTo(-30, -2, -18, -24, 0, -10);
      ctx.bezierCurveTo(18, -24, 30, -2, 0, 18);
      ctx.stroke();
      break;
    case 'seek':
      ctx.beginPath();
      ctx.moveTo(-22, 16);
      ctx.quadraticCurveTo(-4, -22, 20, -6);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(12, -14); ctx.lineTo(24, -4); ctx.lineTo(10, 2);
      ctx.stroke();
      break;
    case 'fork':
      ctx.beginPath();
      ctx.moveTo(0, 22); ctx.lineTo(0, 2);
      ctx.moveTo(0, 2); ctx.lineTo(-18, -20);
      ctx.moveTo(0, 2); ctx.lineTo(18, -20);
      ctx.stroke();
      break;
    case 'amp':
      ctx.beginPath();
      ctx.moveTo(-20, 18); ctx.lineTo(4, 18); ctx.lineTo(-4, -18); ctx.lineTo(-26, -18);
      ctx.closePath(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(10, 6); ctx.lineTo(24, -18);
      ctx.stroke();
      break;
    case 'rapid':
      ctx.beginPath();
      ctx.moveTo(6, -24); ctx.lineTo(-14, 4); ctx.lineTo(0, 4); ctx.lineTo(-6, 24);
      ctx.lineTo(16, -6); ctx.lineTo(2, -6); ctx.closePath();
      ctx.stroke();
      break;
    case 'lance':
      for (const dx of [-16, 0, 16]) {
        ctx.beginPath();
        ctx.moveTo(dx, 18); ctx.lineTo(dx, -18);
        ctx.stroke();
      }
      break;
    case 'aegis':
      for (const off of [-7, 7]) {
        ctx.beginPath();
        ctx.moveTo(off, -22); ctx.lineTo(off + 15, -12); ctx.lineTo(off + 15, 6);
        ctx.quadraticCurveTo(off + 7.5, 24, off, 24);
        ctx.quadraticCurveTo(off, 24, off, 24);
        ctx.lineTo(off, -22);
        ctx.stroke();
      }
      break;
    case 'glass':
      ctx.beginPath();
      ctx.moveTo(-20, -18); ctx.lineTo(-4, -2); ctx.lineTo(-12, 6); ctx.lineTo(6, 22);
      ctx.moveTo(-4, -2); ctx.lineTo(14, -10);
      ctx.moveTo(-12, 6); ctx.lineTo(4, 10);
      ctx.stroke();
      break;
    case 'berserk':
      ctx.beginPath();
      ctx.moveTo(0, -24);
      ctx.quadraticCurveTo(14, -6, 8, 6);
      ctx.quadraticCurveTo(18, 4, 16, 16);
      ctx.quadraticCurveTo(10, 24, 0, 24);
      ctx.quadraticCurveTo(-10, 24, -16, 16);
      ctx.quadraticCurveTo(-18, 4, -8, 6);
      ctx.quadraticCurveTo(-14, -6, 0, -24);
      ctx.stroke();
      break;
    case 'volatile':
      ctx.beginPath(); ctx.arc(0, 6, 17, 0, TAU); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(8, -10); ctx.quadraticCurveTo(16, -22, 6, -24);
      ctx.stroke();
      break;
    case 'vampire':
      ctx.beginPath();
      ctx.moveTo(-14, -6); ctx.lineTo(-6, 20); ctx.lineTo(0, -2); ctx.lineTo(6, 20); ctx.lineTo(14, -6);
      ctx.stroke();
      break;
    case 'arc':
      ctx.beginPath();
      ctx.moveTo(-6, -24); ctx.lineTo(-16, -2); ctx.lineTo(-2, -2); ctx.lineTo(-10, 24);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(6, -20); ctx.lineTo(16, 0); ctx.lineTo(2, 0); ctx.lineTo(10, 22);
      ctx.stroke();
      break;
    case 'focus':
      ctx.beginPath(); ctx.arc(0, 0, 22, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 11, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 3, 0, TAU); ctx.fill();
      break;
    case 'mirror':
      ctx.beginPath();
      ctx.moveTo(0, -22); ctx.lineTo(0, 22);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-20, -4); ctx.lineTo(-8, -4); ctx.moveTo(-20, 4); ctx.lineTo(-8, 4);
      ctx.moveTo(8, -4); ctx.lineTo(20, -4); ctx.moveTo(8, 4); ctx.lineTo(20, 4);
      ctx.stroke();
      break;
    default:
      ctx.beginPath(); ctx.arc(0, 0, 20, 0, TAU); ctx.stroke();
  }
  ctx.lineCap = 'butt';
}

function wrapText(text, cx, y, maxW, lh) {
  const words = String(text).split(' ');
  let line = '';
  const lines = [];
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) {
      lines.push(line);
      line = w;
    } else line = test;
  }
  if (line) lines.push(line);
  const startY = y - ((lines.length - 1) * lh) / 2;
  lines.forEach((l, i) => ctx.fillText(l, cx, startY + i * lh));
}

  }

  // copy-report button
  const bw2 = 208, bh2 = 30, bx2 = W / 2 - bw2 / 2, by2 = Math.max(lineY + 12, 448);
  G.copyRect = { x: bx2, y: by2, w: bw2, h: bh2 };
  ctx.strokeStyle = G.copied > 0 ? 'rgba(125,255,176,0.9)' : 'rgba(140,160,190,0.5)';
  ctx.lineWidth = 1.3;
  roundedRect(ctx, bx2, by2, bw2, bh2, 9);
  ctx.stroke();
  ctx.font = '700 13px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
  ctx.fillStyle = G.copied > 0 ? '#7dffb0' : 'rgba(190,205,225,0.9)';
  ctx.fillText(G.copied > 0 ? t('copied') : t('copyReport'), W / 2, by2 + 20);
  if (G.copied > 0) G.copied -= 1 / 60;

  const pulse = 0.55 + Math.sin(G.time * 4) * 0.35;
  ctx.globalAlpha = pulse;
  ctx.font = '800 19px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#54f2ff';
  ctx.fillText(t('again'), W / 2, by2 + 66);
  ctx.globalAlpha = 1;
}

function drawVictory() {
  ctx.fillStyle = 'rgba(4,5,12,0.88)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.save();
  ctx.translate(W / 2, 210);
  const g = ctx.createLinearGradient(-340, -50, 340, 40);
  g.addColorStop(0, TONES[0].hex);
  g.addColorStop(0.5, TONES[1].hex);
  g.addColorStop(1, TONES[2].hex);
  ctx.font = '800 54px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
  ctx.fillStyle = g;
  ctx.fillText(t('victory'), 0, 0);
  ctx.restore();

  ctx.font = '700 15px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(180,198,222,0.9)';
  ctx.fillText(t('allCleared', FINAL_FLOOR), W / 2, 256);

  ctx.font = '800 44px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#eafcff';
  ctx.fillText(String(G.score), W / 2, 330);

  ctx.font = '700 15px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(170,188,212,0.85)';
  ctx.fillText(t('best') + ' ' + G.best + '   ·   ' + Math.round(G.time) + (LANG === 'zh' ? ' 秒' : 's'), W / 2, 372);

  const pulse = 0.55 + Math.sin(G.time * 4) * 0.35;
  ctx.globalAlpha = pulse;
  ctx.font = '800 20px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#54f2ff';
  const takenWin = CARDS.filter((c) => (G.upg.counts[c.id] || 0) > 0);
  if (takenWin.length) {
    ctx.font = '700 13px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = TONES[G.tone].hex;
    ctx.fillText(takenWin.map((c) => (LANG === 'zh' && c.zh ? c.zh : c.name) + ' ' + 'I'.repeat(G.upg.counts[c.id])).join('  ·  '), W / 2, 410);
  }

  ctx.fillText(t('endless'), W / 2, 470);
  ctx.globalAlpha = 1;
}

function drawPaused() {
  ctx.fillStyle = 'rgba(4,5,12,0.72)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = '800 44px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#54f2ff';
  ctx.fillText(t('paused'), W / 2, H / 2);
  ctx.font = '600 14px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(170,188,212,0.8)';
  ctx.fillText(t('resume'), W / 2, H / 2 + 34);

  const taken = CARDS.filter((c) => (G.upg.counts[c.id] || 0) > 0);
  if (taken.length) {
    ctx.font = '700 12px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = 'rgba(140,160,190,0.8)';
    ctx.fillText(t('loadout'), W / 2, H / 2 + 84);
    ctx.font = '700 14px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = TONES[G.tone].hex;
    ctx.fillText(taken.map((c) => (LANG === 'zh' && c.zh ? c.zh : c.name) + ' ' + 'I'.repeat(G.upg.counts[c.id])).join('  ·  '), W / 2, H / 2 + 106);
  }
}

function drawRotateHint() {
  ctx.fillStyle = 'rgba(4,5,12,0.86)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = '800 34px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#54f2ff';
  ctx.fillText(LANG === 'zh' ? '请把手机横过来' : 'ROTATE YOUR DEVICE', W / 2, H / 2 - 20);
  ctx.font = '600 18px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(180,198,222,0.85)';
  ctx.fillText(LANG === 'zh' ? '横屏体验更好（仍可竖屏继续）' : 'landscape plays better (portrait still works)', W / 2, H / 2 + 24);
  ctx.font = '600 14px ui-monospace, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(150,170,200,0.7)';
  ctx.fillText(LANG === 'zh' ? '点一下继续' : 'tap to continue', W / 2, H / 2 + 66);
}

function render() {
  const sx = G.shake > 0 ? rand(-G.shake, G.shake) : 0;
  const sy = G.shake > 0 ? rand(-G.shake, G.shake) : 0;

  ctx.save();
  ctx.translate(sx, sy);
  drawBackground();
  if (G.state !== 'menu') {
    drawBricks();
    drawBolts();
    drawFusionBeam();
  drawHazards();
    drawPaddle();
    drawBalls();
    drawShockwaves();
    drawParticles();
    drawShards();
    drawFloaters();
  }
  ctx.restore();

  if (G.state !== 'menu') drawHud();

  if (G.state === 'menu') drawMenu();
  if (G.state === 'cardselect') drawCardSelect();
  if (G.state === 'paused') drawPaused();
  if (G.state === 'gameover') drawGameOver();
  if (G.state === 'victory') drawVictory();

  if (G.combo >= 5 && G.state === 'playing') {
    const heat = Math.min(1, (G.combo - 4) / 24);
    const grd = ctx.createRadialGradient(W / 2, H / 2, H * 0.42, W / 2, H / 2, H * 0.9);
    grd.addColorStop(0, 'rgba(255,209,102,0)');
    grd.addColorStop(1, 'rgba(255,209,102,' + (heat * 0.20).toFixed(3) + ')');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);
  }

  if (G.flash > 0) {
    ctx.fillStyle = 'rgba(255,79,109,' + (G.flash * 0.22) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  if (G.portraitHint && G.state !== 'menu') drawRotateHint();
}

/* ----------------------------- loop ---------------------------- */

let last = 0;
function frame(now) {
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;

  update(dt);
  render();
  requestAnimationFrame(frame);
}

/* ---------------------------- resize --------------------------- */

function resize() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  const cssW = Math.floor(W * scale);
  const cssH = Math.floor(H * scale);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  ctx.setTransform((cssW / W) * dpr, 0, 0, (cssH / H) * dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;
  const portrait = window.innerHeight > window.innerWidth * 1.15;
  G.portraitHint = portrait && !G.portraitDismissed;
}

/* ---------------------------- events --------------------------- */

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

let touchDrag = null;

canvas.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch' && touchDrag) {
    const r = canvas.getBoundingClientRect();
    const dx = ((e.clientX - touchDrag.x) / Math.max(r.width, 1)) * W;
    G.pointers.active = true;
    G.pointers.x = touchDrag.target + dx;
    G.paddle.targetX = G.pointers.x;
    if (G.state === 'cardselect') pointerMove(e.clientX, e.clientY);
    return;
  }
  pointerMove(e.clientX, e.clientY);
});
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (e.pointerType === 'touch') {
    const r = canvas.getBoundingClientRect();
    touchDrag = { x: e.clientX, target: G.paddle.targetX, w: r.width };
  }
  onPointerDown(e.clientX, e.clientY);
});
canvas.addEventListener('pointerup', (e) => { if (e.pointerType === 'touch') touchDrag = null; });
canvas.addEventListener('pointercancel', () => { touchDrag = null; });
canvas.addEventListener('pointerleave', () => { G.pointers.active = false; touchDrag = null; });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

window.addEventListener('keydown', (e) => {
  G.keys = G.keys || {};
  G.keys[e.key] = true;
  if (e.key === ' ') e.preventDefault();
  Sound.init();
  Sound.resume();

  if (G.state === 'playing') {
    if (e.key === 'q' || e.key === 'Q') { setTone(G.tone + 2); return; }
    if (e.key === 'e' || e.key === 'E') { setTone(G.tone + 1); return; }
    if (e.key === '1' || e.key === '2' || e.key === '3') { setTone(parseInt(e.key, 10) - 1); return; }
    if (e.key === 'Shift') { tryOverdrive(); return; }
    if (e.key === 'f' || e.key === 'F') { tryFusion(); return; }
  }
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
    if (G.state === 'playing') G.state = 'paused';
    else if (G.state === 'paused') G.state = 'playing';
    return;
  }
  if ((e.key === 'c' || e.key === 'C') && (G.state === 'gameover' || G.state === 'victory')) {
    copyReport();
    return;
  }
  if (e.key === 'l' || e.key === 'L') {
    setLang(LANG === 'zh' ? 'en' : 'zh');
    return;
  }
  if (e.key === 'm' || e.key === 'M') {
    Sound.toggle();
    return;
  }
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    if (G.state === 'menu') startRun();
    else if (G.state === 'gameover') { if (G.time - (G.deadAt || 0) > 0.6) startRun(G.daily); }
    else if (G.state === 'playing') launchStuck();
    return;
  }
  if (G.state === 'cardselect') {
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= G.cardChoices.length) chooseCard(n - 1);
  }
});

window.addEventListener('keyup', (e) => {
  if (G.keys) G.keys[e.key] = false;
});

window.addEventListener('blur', () => {
  G.keys = {};
  if (G.state === 'playing') G.state = 'paused';
});

/* ----------------------------- boot ---------------------------- */

loadBest();
loadStats();
G.upg = freshUpgrades();
G.paddle.w = paddleWidth();
resize();
requestAnimationFrame(frame);

// expose a tiny hook for automated smoke tests
window.__prism = {
  get state() { return G.state; },
  get score() { return G.score; },
  get level() { return G.level; },
  get lives() { return G.lives; },
  get bricks() { return bricksLeft(); },
  get ballCount() { return G.balls.length; },
  start: startRun,
  hit: (i, tone) => damageBrick(G.bricks[i], G.upg.dmg, G.bricks[i].x + 5, G.bricks[i].y + 5, false, tone === undefined ? G.tone : tone),
  debug: G,
};
})();
</script>
