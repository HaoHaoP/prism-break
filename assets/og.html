<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;width:1280px;height:630px;overflow:hidden;background:#05060d;
    font-family:ui-monospace,Menlo,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#eafcff}
  .wrap{position:relative;width:1280px;height:630px;
    background:radial-gradient(900px 420px at 50% 40%,rgba(84,242,255,.13),transparent 70%),
               radial-gradient(700px 400px at 84% 92%,rgba(255,79,216,.13),transparent 70%),#05060d}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(84,242,255,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(84,242,255,.055) 1px,transparent 1px);background-size:48px 48px}
  .title{position:absolute;left:0;right:0;top:118px;text-align:center;font-size:110px;font-weight:900;letter-spacing:2px;
    background:linear-gradient(90deg,#54f2ff 0%,#b07bff 50%,#ffd166 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{position:absolute;left:0;right:0;top:250px;text-align:center;font-size:25px;font-weight:600;color:rgba(214,228,245,.92)}
  .cn{position:absolute;left:0;right:0;top:290px;text-align:center;font-size:21px;font-weight:700;color:rgba(84,242,255,.9)}
  .line{position:absolute;left:0;right:0;top:332px;text-align:center;font-size:18px;color:rgba(160,180,210,.85)}
  .row{position:absolute;left:0;right:0;top:396px;display:flex;gap:16px;justify-content:center}
  .b{width:120px;height:38px;border-radius:7px;display:flex;align-items:center;justify-content:center;
     font-size:13px;font-weight:800;color:#0a1020}
  .stat{position:absolute;left:0;right:0;bottom:46px;text-align:center;font-size:17px;color:rgba(150,170,200,.9)}
  .hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:14px;color:rgba(120,140,175,.78)}
</style></head><body><div class="wrap"><div class="grid"></div>
  <div class="title">PRISM BREAK</div>
  <div class="sub">a neon brick-breaker roguelike — one file, zero dependencies</div>
  <div class="cn">棱镜爆破 · 同色命中伤害翻倍</div>
  <div class="row">
    <div class="b" style="background:linear-gradient(180deg,#54f2ff,#17607c)">CYAN</div>
    <div class="b" style="background:linear-gradient(180deg,#b07bff,#4a2c8f)">VIOLET</div>
    <div class="b" style="background:linear-gradient(180deg,#ffd166,#8a6a1f)">AMBER</div>
  </div>
  <div class="stat">21 upgrades · 10 floors · overdrive burst</div>
  <div class="hint">prism.haohaop.com</div>
</div></body></html>
